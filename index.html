<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Placas Ociosas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',sans-serif;font-size:13px}
header{background:#1a1d2e;border-bottom:1px solid #2d3748;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;color:#63b3ed;font-weight:700}
.hdr-info{color:#718096;font-size:11px}
.update-bar{background:#1a2535;border-bottom:1px solid #2d3748;padding:7px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.update-bar span{font-size:11px;color:#718096}
.btn-upload{background:#2b3a50;color:#63b3ed;border:1px solid #3d5a7a;border-radius:5px;padding:4px 11px;font-size:11px;cursor:pointer}
.btn-upload:hover{background:#344a66}
.main{padding:10px 16px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:10px;flex-shrink:0}
.sc{background:#1a1d2e;border-radius:7px;padding:9px 13px;border-left:3px solid #4a5568}
.sc.b{border-left-color:#63b3ed}.sc.r{border-left-color:#fc8181}.sc.o{border-left-color:#f6ad55}.sc.y{border-left-color:#f6e05e}.sc.g{border-left-color:#68d391}
.sc .v{font-size:22px;font-weight:700;line-height:1}.sc .l{font-size:11px;color:#718096;margin-top:3px}
.reasons-panel{background:#1a1d2e;border-radius:7px;padding:9px 13px;margin-bottom:10px;flex-shrink:0}
.reasons-panel h3{font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.rg{display:flex;flex-wrap:wrap;gap:5px}
.rp{background:#2d3748;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
.rp:hover{border-color:#63b3ed}.rp.active{background:#2b4a7e;border-color:#63b3ed;color:#90cdf4}
.rp.nr{background:#3d2a2a}.rp.nr.active{background:#5c1e1e;border-color:#fc8181}
.rp .cnt{background:#4a5568;border-radius:8px;padding:1px 5px;font-size:10px;margin-left:3px}
.filters{background:#1a1d2e;border-radius:7px;padding:9px 13px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;flex-shrink:0}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.05em}
select{background:#2d3748;color:#e2e8f0;border:1px solid #4a5568;border-radius:5px;padding:5px 8px;font-size:12px;min-width:125px;cursor:pointer}
select:focus{outline:none;border-color:#63b3ed}
.btn{padding:5px 11px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.bp{background:#2b4a7e;color:#90cdf4;border:1px solid #4a7dbf}.bp:hover{background:#3a5f9e}
.ba{background:#4a1e1e;color:#fc8181;border:1px solid #9b2c2c}.ba:hover{background:#5c2626}
.br{background:#2d3748;color:#a0aec0;border:1px solid #4a5568}.br:hover{background:#3d4b5c}
.fi{color:#718096;font-size:11px;margin-left:auto;align-self:center}
.tw{border-radius:7px;border:1px solid #2d3748;overflow-x:auto}
.mlp-panel{background:#1a1d2e;border-radius:7px;padding:9px 13px;margin-bottom:10px}
.mlp-panel h3{font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.mlp-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mlp-rank{width:22px;text-align:right;font-size:11px;color:#718096;flex-shrink:0}
.mlp-name{width:220px;font-size:12px;color:#e2e8f0;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlp-bar-wrap{flex:1;background:#2d3748;border-radius:4px;height:14px;overflow:hidden;min-width:60px}
.mlp-bar{height:100%;border-radius:4px}
.mlp-count{width:38px;text-align:right;font-size:12px;font-weight:700;color:#f6e05e;flex-shrink:0}
.mlp-top .mlp-name{color:#fc8181;font-weight:700}
.mlp-top .mlp-count{color:#fc8181}
table{width:100%;border-collapse:collapse;min-width:980px}
thead tr{background:#1a1d2e}
thead{position:sticky;top:0;z-index:10}
th{padding:8px 9px;text-align:left;font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #2d3748;white-space:nowrap;cursor:pointer;user-select:none;background:#1a1d2e}
th:hover{color:#a0aec0}
th.asc::after{content:' ▲'}th.desc::after{content:' ▼'}th:not(.asc):not(.desc) span.si::after{content:' ⇅';opacity:.4}
tbody tr{border-bottom:1px solid #1e2235;transition:background .1s}
tbody tr:hover{background:#1e2235!important}
tbody tr:nth-child(even){background:#131620}
td{padding:7px 9px;vertical-align:middle}
.plate{font-family:monospace;font-size:13px;font-weight:700;color:#90cdf4;letter-spacing:.06em}
.hours{font-weight:600;color:#f6e05e}.hours.crit{color:#fc8181}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.t0{color:#4a5568;font-style:italic;font-size:11px}
.t1{background:#2d4a2d;color:#68d391}.t2{background:#2d2d4a;color:#a78bfa}.t3{background:#4a2d2d;color:#fc8181}
.t4{background:#3d3d20;color:#f6e05e}.t5{background:#4a3d1e;color:#f6ad55}.t6{background:#4a1e3d;color:#f687b3}
.t7{background:#1e3d4a;color:#63b3ed}.t8{background:#3d1e4a;color:#b794f4}
.dexp{color:#fc8181;font-weight:700;text-decoration:underline}.durg{color:#fc8181;font-weight:700}
.dwrn{color:#f6ad55;font-weight:600}.dok{color:#68d391}
.rbr{background:#1a1d2e;color:#63b3ed;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
.rbt{background:#1e3d2d;color:#68d391;padding:2px 6px;border-radius:4px;font-size:11px}
.row-exp{background:#2a1515!important}.row-urg{background:#2a2010!important}
.nd{text-align:center;padding:40px;color:#4a5568}
</style>
</head>
<body>
<header>
  <div>
    <h1>🚛 Painel de Placas Ociosas</h1>
    <div class="hdr-info" id="hdrInfo">Gerado em 16/04/2026 10:37 — 2711 registros</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span style="font-size:11px;color:#718096">Referência:</span>
    <span style="font-weight:700;color:#f6e05e" id="refDate">16/04/2026</span>
  </div>
</header>

<div class="update-bar">
  <span>Atualizar dados:</span>
  <label class="btn-upload">📂 Carregar novo CSV <input type="file" id="csvFile" accept=".csv" style="display:none"></label>
  <span id="updateMsg" style="color:#68d391"></span>
</div>

<div class="main">
  <div class="stats-row" id="stats"></div>
  <div class="mlp-panel">
    <h3>&#x1F3C6; Ranking Transportador &mdash; Placas Sem Motivo</h3>
    <div id="mlpRank"></div>
  </div>
  <div class="reasons-panel">
    <h3>Razões / Justificativas</h3>
    <div class="rg" id="rg"></div>
  </div>
  <div class="filters">
    <div class="fg"><label>Regional</label><select id="fReg"><option value="">Todas</option></select></div>
    <div class="fg"><label>SVC / Sub Região</label><select id="fSvc"><option value="">Todos</option></select></div>
    <div class="fg"><label>MLP / Tipo</label><select id="fMlp"><option value="">Todos</option></select></div>
    <div class="fg"><label>Transportador</label><select id="fTrp"><option value="">Todos</option></select></div>
    <div class="fg"><label>Centro de Custos</label><select id="fCC"><option value="">Todos</option></select></div>
    <div class="fg"><label>Prazo</label>
      <select id="fPrazo">
        <option value="">Todos</option>
        <option value="exp">⚠️ Vencido</option>
        <option value="urg">⚡ Vence hoje</option>
        <option value="wrn">🔶 Vence em 2 dias</option>
        <option value="ok">✅ Prazo ok</option>
        <option value="none">— Sem prazo</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;align-self:flex-end">
      <button class="btn bp" id="btnSM" onclick="toggleSM()">Sem Motivo</button>
      <button class="btn br" onclick="reset()">Limpar Filtros</button>
    </div>
    <div class="fi" id="fi"></div>
  </div>
  <div class="tw">
    <table>
      <thead><tr>
        <th onclick="sort('veiculo')">Placa<span class="si"></span></th>
        <th onclick="sort('horasNum')">Ócio<span class="si"></span></th>
        <th onclick="sort('razao')">Razão<span class="si"></span></th>
        <th onclick="sort('dataRetorno')">Retorno<span class="si"></span></th>
        <th onclick="sort('regiao')">Regional<span class="si"></span></th>
        <th onclick="sort('subRegiao')">Sub Região<span class="si"></span></th>
        <th onclick="sort('tipo')">Tipo<span class="si"></span></th>
        <th onclick="sort('transportador')">Transportador<span class="si"></span></th>
        <th onclick="sort('centroCustos')">Centro de Custos<span class="si"></span></th>
        <th onclick="sort('inicioOcio')">Início Ócio<span class="si"></span></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

nsportador":"BLESSED","centroCustos":"BLESSED","inicioOcio":"12/04/2026 20:29:14","horasStr":"3D 16h","horasNum":88},{"veiculo":"UFK1A90","razao":"","dataRetorno":"","tipo":"VUC","regiao":"SPIO","subRegiao":"SSP3 - Campinas","transportador":"BLESSED","centroCustos":"BLESSED","inicioOcio":"14/04/2026 19:35:32","horasStr":"1D 17h","horasNum":41},{"veiculo":"UHK3E79","razao":"","dataRetorno":"","tipo":"VUC","regiao":"SP3","subRegiao":"SSP49 - Zona Norte 2","transportador":"ECO EXPRESS","centroCustos":"Dedicado - Eco Express","inicioOcio":"14/04/2026 21:47:42","horasStr":"1D 15h","horasNum":39}];
let filtered = [], sortCol = 'horasNum', sortDir = -1, rfilt = null, smActive = false;

function parseHours(s) {
  if (!s) return 0;
  let t=0, m;
  m=s.match(/(\d+)M/); if(m) t+=+m[1]*720;
  m=s.match(/(\d+)D/); if(m) t+=+m[1]*24;
  m=s.match(/(\d+)h/); if(m) t+=+m[1];
  return t;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  const rows = [];
  for (let i=1;i<lines.length;i++) {
    const l=lines[i].trim(); if(!l) continue;
    const c=parseLine(l);
    if(c.length<12) continue;
    rows.push({veiculo:c[0],razao:c[1],dataRetorno:c[2],modelo:c[3],tipo:c[4],base:c[5],regiao:c[6],subRegiao:c[7],transportador:c[8],centroCustos:c[9],inicioOcio:c[10],horasStr:c[11],horasNum:parseHours(c[11])});
  }
  return rows;
}
function parseLine(l) {
  const c=[]; let cur='',inQ=false;
  for(let i=0;i<l.length;i++){
    if(l[i]==='"') inQ=!inQ;
    else if(l[i]===','&&!inQ){c.push(cur.trim());cur='';}
    else cur+=l[i];
  }
  c.push(cur.trim()); return c;
}

function ds(d) {
  if(!d||!d.trim()) return 'none';
  const dt=new Date(d); if(isNaN(dt)) return 'none';
  const diff=Math.floor((dt-TODAY)/86400000);
  if(diff<0) return 'exp'; if(diff===0) return 'urg'; if(diff<=2) return 'wrn'; return 'ok';
}
function fmtDate(d) {
  if(!d||!d.trim()) return '';
  const dt=new Date(d); if(isNaN(dt)) return d;
  const s=ds(d), diff=Math.floor((dt-TODAY)/86400000);
  const f=dt.toLocaleDateString('pt-BR');
  const map={exp:'dexp',urg:'durg',wrn:'dwrn',ok:'dok',none:''};
  const sfx=s==='exp'?' ⚠️ VENCIDO':s==='urg'?' ⚡ HOJE':s==='wrn'?` (+${diff}d)`:'';
  return `<span class="${map[s]||''}">${f}${sfx}</span>`;
}
function tagR(r) {
  if(!r||!r.trim()) return '<span class="t0">Sem motivo</span>';
  const v=r.toLowerCase(); let c='t4';
  if(v.includes('folga')) c='t1';
  else if(v.includes('sem motorista')) c='t2';
  else if(v.includes('bloqueio otr')) c='t3';
  else if(v.includes('sinistro')||v.includes('loss')) c='t3';
  else if(v.includes('sem rota')) c='t5';
  else if(v.includes('absenteísmo')||v.includes('absenteismo')) c='t6';
  else if(v.includes('locadora')) c='t7';
  else if(v.includes('rota presa')) c='t8';
  return `<span class="tag ${c}">${esc(r)}</span>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderMlpRank() {
  const reg = document.getElementById('fReg').value;
  const svc = document.getElementById('fSvc').value;
  const mlp = document.getElementById('fMlp').value;
  const trp = document.getElementById('fTrp').value;
  const cc  = document.getElementById('fCC').value;
  const base = ALL.filter(r => {
    if (r.razao.trim()) return false;
    if (reg && r.regiao !== reg) return false;
    if (svc && r.subRegiao !== svc) return false;
    if (mlp && r.tipo !== mlp) return false;
    if (trp && r.transportador !== trp) return false;
    if (cc  && r.centroCustos !== cc) return false;
    return true;
  });
  const cnt = {};
  base.forEach(r => { const k = r.transportador.trim() || '(sem transportador)'; cnt[k] = (cnt[k]||0)+1; });
  const sorted = Object.entries(cnt).sort((a,b) => b[1]-a[1]);
  const max = sorted.length ? sorted[0][1] : 1;
  const colors = ['#fc8181','#f6ad55','#f6e05e','#68d391','#63b3ed','#a78bfa','#f687b3','#4fd1c5','#76e4f7','#9ae6b4'];
  document.getElementById('mlpRank').innerHTML = sorted.map(([k,n],i) => {
    const pct = Math.round(n/max*100);
    const col = colors[i % colors.length];
    const top = i===0 ? ' mlp-top' : '';
    return `<div class="mlp-row${top}">
      <div class="mlp-rank">#${i+1}</div>
      <div class="mlp-name" title="${esc(k)}">${esc(k)}</div>
      <div class="mlp-bar-wrap"><div class="mlp-bar" style="width:${pct}%;background:${col}"></div></div>
      <div class="mlp-count">${n}</div>
    </div>`;
  }).join('');
}
function init(){ populateFilters(); apply(); }

function populateFilters() {
  const base=ALL.filter(r=>r.horasNum>36);
  fill('fReg',[...new Set(base.map(r=>r.regiao).filter(Boolean))].sort());
  fill('fMlp',[...new Set(base.map(r=>r.tipo).filter(Boolean))].sort());
  fill('fTrp',[...new Set(base.map(r=>r.transportador).filter(Boolean))].sort());
  fill('fCC',[...new Set(base.map(r=>r.centroCustos).filter(Boolean))].sort());
  updSvc();
}
function fill(id, vals) {
  const sel=document.getElementById(id);
  const first=sel.options[0].cloneNode(true);
  sel.innerHTML=''; sel.appendChild(first);
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
}
function updSvc() {
  const reg=document.getElementById('fReg').value;
  const base=ALL.filter(r=>r.horasNum>36&&(!reg||r.regiao===reg));
  const cur=document.getElementById('fSvc').value;
  fill('fSvc',[...new Set(base.map(r=>r.subRegiao).filter(Boolean))].sort());
  if([...document.getElementById('fSvc').options].some(o=>o.value===cur)) document.getElementById('fSvc').value=cur;
}
function toggleSM() {
  smActive=!smActive;
  document.getElementById('btnSM').className='btn '+(smActive?'ba':'bp');
  if(smActive) rfilt=null;
  apply();
}
function reset() {
  ['fReg','fSvc','fMlp','fTrp','fCC','fPrazo'].forEach(id=>document.getElementById(id).value='');
  smActive=false; rfilt=null;
  document.getElementById('btnSM').className='btn bp';
  updSvc(); apply();
}
function apply() {
  const reg=document.getElementById('fReg').value, svc=document.getElementById('fSvc').value;
  const mlp=document.getElementById('fMlp').value, trp=document.getElementById('fTrp').value;
  const cc=document.getElementById('fCC').value, prazo=document.getElementById('fPrazo').value;
  filtered=ALL.filter(r=>{
    if(r.horasNum<=36) return false;
    if(reg&&r.regiao!==reg) return false;
    if(svc&&r.subRegiao!==svc) return false;
    if(mlp&&r.tipo!==mlp) return false;
    if(trp&&r.transportador!==trp) return false;
    if(cc&&r.centroCustos!==cc) return false;
    if(prazo&&ds(r.dataRetorno)!==prazo) return false;
    if(smActive&&r.razao.trim()!=='') return false;
    if(rfilt!==null){
      if(rfilt==='__SM__'&&r.razao.trim()!=='') return false;
      if(rfilt!=='__SM__'&&r.razao!==rfilt) return false;
    }
    return true;
  });
  doSort(); renderStats(); renderReasons(); renderTable(); renderMlpRank();
}
function doSort() {
  filtered.sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(sortCol==='dataRetorno'){va=va?new Date(va).getTime():9e15;vb=vb?new Date(vb).getTime():9e15;}
    if(typeof va==='number') return sortDir*(va-vb);
    return sortDir*String(va).localeCompare(String(vb),'pt-BR');
  });
}
function sort(col) {
  if(sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=col==='horasNum'?-1:1;}
  document.querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
  const cols=['veiculo','horasNum','razao','dataRetorno','regiao','subRegiao','tipo','transportador','centroCustos','inicioOcio'];
  const idx=cols.indexOf(col);
  if(idx>=0) document.querySelectorAll('th')[idx].classList.add(sortDir>0?'asc':'desc');
  doSort(); renderTable();
}
function renderStats() {
  const totalFrota=ALL.length;
  const total24h=ALL.filter(r=>r.horasNum>=24).length;
  const sm=filtered.filter(r=>!r.razao.trim()).length;
  const exp=filtered.filter(r=>ds(r.dataRetorno)==='exp').length;
  const urg=filtered.filter(r=>['urg','wrn'].includes(ds(r.dataRetorno))).length;
  const crit=filtered.filter(r=>r.horasNum>=168).length;
  const tot=ALL.filter(r=>r.horasNum>36).length;
  document.getElementById('stats').innerHTML=`
    <div class="sc" style="border-left-color:#b794f4"><div class="v" style="color:#b794f4">${totalFrota}</div><div class="l">&#x1F69B; Total Ociosas VecFleet</div></div>
    <div class="sc" style="border-left-color:#4fd1c5"><div class="v" style="color:#4fd1c5">${total24h}</div><div class="l">&#x23F0; Ociosas &ge;24h</div></div>
    <div class="sc b"><div class="v">${filtered.length}</div><div class="l">Placas exibidas (>36h)</div></div>
    <div class="sc r"><div class="v">${sm}</div><div class="l">Sem motivo</div></div>
    <div class="sc r"><div class="v">${exp}</div><div class="l">Prazo vencido</div></div>
    <div class="sc o"><div class="v">${urg}</div><div class="l">Prazo expirando (≤2d)</div></div>
    <div class="sc y"><div class="v">${crit}</div><div class="l">Crítico (≥7 dias)</div></div>
    <div class="sc g"><div class="v">${tot}</div><div class="l">Total >36h no arquivo</div></div>`;
}
function renderReasons() {
  const all36=ALL.filter(r=>r.horasNum>36);
  const tm={},fm={};
  all36.forEach(r=>{const k=r.razao.trim()||'__SM__';tm[k]=(tm[k]||0)+1;});
  filtered.forEach(r=>{const k=r.razao.trim()||'__SM__';fm[k]=(fm[k]||0)+1;});
  const sorted=Object.entries(tm).sort((a,b)=>b[1]-a[1]);
  document.getElementById('rg').innerHTML=sorted.map(([k,t])=>{
    const shown=fm[k]||0, lbl=k==='__SM__'?'🚫 Sem Motivo':k;
    const isA=rfilt===k||(smActive&&k==='__SM__');
    const cls='rp'+(k==='__SM__'?' nr':'')+(isA?' active':'');
    return `<div class="${cls}" onclick="fReason('${k.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${esc(lbl)}<span class="cnt">${shown}/${t}</span></div>`;
  }).join('');
}
function fReason(k) {
  rfilt=rfilt===k?null:k;
  if(rfilt!==null){smActive=false;document.getElementById('btnSM').className='btn bp';}
  apply();
}
function renderTable() {
  document.getElementById('fi').textContent=`${filtered.length} placa${filtered.length!==1?'s':''}`;
  if(!filtered.length){document.getElementById('tb').innerHTML='<tr><td colspan="10" class="nd">Nenhuma placa encontrada</td></tr>';return;}
  document.getElementById('tb').innerHTML=filtered.map(r=>{
    const d=ds(r.dataRetorno);
    const rc=d==='exp'?' class="row-exp"':d==='urg'?' class="row-urg"':'';
    const hc=r.horasNum>=168?' crit':'';
    return `<tr${rc}><td><span class="plate">${esc(r.veiculo)}</span></td><td><span class="hours${hc}">${esc(r.horasStr)}</span></td><td>${tagR(r.razao)}</td><td>${fmtDate(r.dataRetorno)||'<span style="color:#4a5568">—</span>'}</td><td><span class="rbr">${esc(r.regiao)}</span></td><td style="color:#a0aec0;font-size:11px">${esc(r.subRegiao)}</td><td><span class="rbt">${esc(r.tipo)}</span></td><td>${esc(r.transportador)}</td><td style="color:#718096;font-size:11px">${esc(r.centroCustos)}</td><td style="color:#718096;font-size:11px">${esc(r.inicioOcio)}</td></tr>`;
  }).join('');
}

document.getElementById('csvFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    ALL=parseCSV(ev.target.result);
    rfilt=null; smActive=false;
    document.getElementById('btnSM').className='btn bp';
    document.getElementById('fPrazo').value='';
    populateFilters(); apply();
    document.getElementById('updateMsg').textContent=`✓ ${ALL.length} registros (${f.name})`;
    document.getElementById('hdrInfo').textContent=`Atualizado: ${new Date().toLocaleString('pt-BR')} — ${ALL.length} registros`;
    setTimeout(()=>document.getElementById('updateMsg').textContent='',5000);
  };
  r.readAsText(f,'UTF-8');
});

['fReg','fSvc','fMlp','fTrp','fCC','fPrazo'].forEach(id=>{
  document.getElementById(id).addEventListener('change',()=>{if(id==='fReg')updSvc();apply();});
});

init();
</script>
